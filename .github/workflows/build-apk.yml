

name: Build GamerFleet APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o tools.zip
          mkdir tools-temp
          unzip -q tools.zip -d tools-temp
          mv tools-temp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q GamerFleet_The_Rise_Android_Project_v2.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/GamerFleet_The_Rise_Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GamerFleet-The-Rise-APK
          path: extracted/GamerFleet_The_Rise_Android/app/build/outputs/apk/debug/app-debug.apk
          

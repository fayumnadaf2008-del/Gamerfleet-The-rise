
name: Build GamerFleet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q GamerFleet_The_Rise_Android_Project_v2.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/GamerFleet_The_Rise_Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GamerFleet-The-Rise-APK
          path: extracted/GamerFleet_The_Rise_Android/app/build/outputs/apk/debug/app-debug.apk
          
